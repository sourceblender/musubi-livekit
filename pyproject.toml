[project]
name = "musubi-livekit"
version = "0.1.0"
description = "LiveKit session callback adapter for the Musubi memory SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "musubi-sdk>=0.1.0",
]

[project.optional-dependencies]
voice = ["livekit-agents>=1.6.10,<1.9", "aiohttp>=3.9", "google-genai>=1"]

[project.urls]
Homepage = "https://github.com/sourceblender/musubi-livekit"
Repository = "https://github.com/sourceblender/musubi-livekit"
Issues = "https://github.com/sourceblender/musubi-livekit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musubi_livekit"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: writes to a disposable Musubi API stack; opt in explicitly"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src/musubi_livekit"]

[[tool.mypy.overrides]]
module = ["musubi_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["musubi.sdk.exceptions"]
ignore_missing_imports = true
