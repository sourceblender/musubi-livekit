name: Publish musubi-livekit

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - name: Check tag matches package version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "tag and package version differ"
          PY
      - run: uv build
      - name: Smoke test wheel and source distribution
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv venv /tmp/musubi-livekit-publish-check --python 3.12 --clear
            uv pip install --python /tmp/musubi-livekit-publish-check/bin/python "$artifact"
            /tmp/musubi-livekit-publish-check/bin/python -c 'import importlib.util as u; import musubi_livekit, musubi_livekit.adapter, musubi_livekit.cache, musubi_livekit.config, musubi_livekit.fast_talker, musubi_livekit.heuristics, musubi_livekit.redaction, musubi_livekit.slow_thinker, musubi_sdk; assert u.find_spec("musubi") is None'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: uv publish
