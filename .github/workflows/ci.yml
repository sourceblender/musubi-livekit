name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/musubi_livekit
      - run: uv run pytest -q
      - run: uv build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sourceblender/musubi
          ref: v1.28.0  # first release whose integration token scopes are admin/, not a person
          path: core
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --extra dev --python 3.12
        working-directory: core
      - run: uv pip install --python core/.venv/bin/python musubi-sdk==0.1.0
      - run: uv pip install --python core/.venv/bin/python --no-deps -e .
      # core >= v1.28.0 no longer ships the LiveKit fixtures; bring this repo's copy.
      - run: cp tests/integration/_livekit_fixtures.py core/tests/integration/_livekit_fixtures.py
      - run: cp tests/integration/test_livekit_e2e.py core/tests/integration/test_livekit_plugin_e2e.py
      - run: uv run --no-sync --extra dev pytest -q -m integration tests/integration/test_livekit_plugin_e2e.py
        working-directory: core
        env:
          # Core's chunked sparse embedder loads the gated SPLADE-v3 tokenizer.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
